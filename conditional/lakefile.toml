name = "cfsg_outside"
defaultTargets = ["CFSGOutside"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# Same Mathlib and TauCeti revisions as AxiomMath/CFSG at 69cb972, so that `unconditional/` can import both.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "b63f6e8a68d220e3b3bc4f3792bb53650d375f24"

[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti"
rev = "6e0c6acab5f4c6f42e5f5bab9bd5e4e84f74c380"

[[lean_lib]]
name = "CFSGOutside"
globs = ["CFSGOutside", "CFSGOutside.+"]

# Comparator challenges: theorem statements with `sorry`, deliberately not a default target.
[[lean_lib]]
name = "Challenge"
globs = ["Challenge.+"]
