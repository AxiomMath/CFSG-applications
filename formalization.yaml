# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Beyond the classification"
  description: >-
    Published theorems from outside the classification of finite simple groups, formalized in Lean 4 on top of the CFSG corpus (AxiomMath/CFSG at commit 69cb972). Each result is given conditionally on the corpus theorems it uses and unconditionally against the corpus.
  authors:
    - "Axiom Math"
  responsible_maintainers:
    - "Rafael Cabral"
    - "Vasily Ilin"
  license: "Apache-2.0"

classification:
  arxiv: ["math.GR"]
  msc2020:
    - "20D05" # Finite simple groups and their classification
    - "68V20" # Formalization of mathematics in connection with theorem provers

